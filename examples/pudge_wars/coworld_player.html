<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pudge Wars</title>
<body style="margin:0;background:#07080b;color:#e1e0cc;font-family:system-ui">
<p>Opening Pudge Wars…</p>
<script>
  // Softmax supplies the public WebSocket address, including the claimed
  // seat. Keep its proxy prefix; /player and /global speak JSON, /ws speaks
  // the native game's binary protocol. The token travels in the WASM Hello.
  const page = new URL(window.location.href)
  const address = new URL(page.searchParams.get('address') || page.href)
  address.protocol = address.protocol === 'https:' || address.protocol === 'wss:' ? 'wss:' : 'ws:'
  address.pathname = address.pathname.replace(/\/(?:client\/)?(?:player|global)$/, '/ws')
  const client = new URL(__WASM_CLIENT_URL__, page)
  client.search = ''
  for (const name of ['slot', 'token', 'name']) {
    const value = address.searchParams.get(name) ?? page.searchParams.get(name)
    if (value !== null) client.searchParams.set(name, value)
  }
  address.search = ''
  address.hash = ''
  client.searchParams.set('join', address.href)
  window.location.replace(client.href)
</script>
</body>
</html>

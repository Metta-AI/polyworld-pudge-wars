<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#07080b">
    <title>hookem</title>
    <link rel="preload" as="image" href="hookem-logo.svg">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #07080b;
        color-scheme: dark;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
      }
      canvas.emscripten {
        border: none;
        background-color: transparent;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        outline: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #boot {
        position: fixed;
        inset: 0;
        background: #07080b;
        color: #e1e0cc;
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        overflow: hidden;
        transition: opacity 0.45s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot [data-pw-void] {
        position: absolute;
        inset: -4%;
        width: 108%;
        height: 108%;
        display: block;
        filter: blur(12px) saturate(0.75) brightness(0.7);
        transform: scale(1.04);
      }
      #boot::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 50% 46%, rgba(7, 8, 11, 0.15) 0%, rgba(7, 8, 11, 0.58) 48%, rgba(7, 8, 11, 0.88) 100%);
        z-index: 1;
      }
      .boot-ui {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 8px 20px 24px;
        max-width: min(40rem, calc(100vw - 24px));
        background: rgba(7, 8, 11, 0.42);
        border: 1px solid rgba(225, 224, 204, 0.08);
      }
      .pw-hero {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7em;
        width: 100%;
      }
      .pw-hero-cover {
        display: block;
        width: min(36rem, 86vw);
        height: auto;
        max-height: min(58vh, 28rem);
        object-fit: contain;
        filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.55));
      }
      .pw-hero-mark {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .pw-hero-rule {
        display: block;
        width: 100%;
        height: 2px;
        background: rgba(225, 224, 204, 0.18);
        overflow: hidden;
      }
      .pw-hero-rule i {
        display: block;
        height: 100%;
        width: 8%;
        background: #e1e0cc;
        transition: width 0.2s ease;
      }
      #boot .note {
        color: #d4d0c2;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.04em;
        line-height: 1.45;
        text-align: center;
        max-width: 28rem;
      }
      #boot .note.error {
        color: #f0a8a2;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-ui">
        <div class="pw-hero">
          <h1 class="pw-hero-mark">hookem</h1>
          <img
            class="pw-hero-cover"
            src="hookem-logo.svg"
            alt="hookem"
            width="720"
            height="240"
          >
          <span class="pw-hero-rule"><i id="bootBar"></i></span>
        </div>
        <div id="bootNote" class="note">Loading…</div>
      </div>
    </div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    <script>
      // Pin the canvas to the visible viewport. iOS layout height includes
      // the area behind Safari chrome, which clips the bottom HUD.
      (function () {
        function fitCanvas () {
          var canvas = document.getElementById('canvas')
          if (!canvas) return
          var vv = window.visualViewport
          var w = Math.round(vv ? vv.width : window.innerWidth)
          var h = Math.round(vv ? vv.height : window.innerHeight)
          var top = Math.round(vv ? vv.offsetTop : 0)
          var nextW = w + 'px'
          var nextH = h + 'px'
          var nextTop = top + 'px'
          if (canvas.dataset.lockCss === '1' &&
              canvas.style.width === nextW &&
              canvas.style.height === nextH &&
              canvas.style.top === nextTop) return
          canvas.dataset.lockCss = '1'
          canvas.style.position = 'fixed'
          canvas.style.left = '0px'
          canvas.style.top = nextTop
          canvas.style.width = nextW
          canvas.style.height = nextH
        }
        fitCanvas()
        window.addEventListener('resize', fitCanvas)
        window.addEventListener('orientationchange', fitCanvas)
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', fitCanvas)
          window.visualViewport.addEventListener('scroll', fitCanvas)
        }
      })()
    </script>
    <script src="recap-overlay.js"></script>
    <script src="touch-input.js"></script>

    <script type='text/javascript'>
      function bootError(text) {
        var boot = document.getElementById('boot');
        var note = document.getElementById('bootNote');
        if (boot) boot.className = '';
        if (note) {
          note.className = 'note error';
          note.textContent = text;
        }
        if (window.pwBoot) window.pwBoot.setError(true);
      }
      function bootGone() {
        var boot = document.getElementById('boot');
        if (boot) boot.className = 'gone';
        setTimeout(function() {
          if (window.pwBoot) window.pwBoot.dispose();
        }, 480);
      }
      function watchLine(line) {
        if (window.pwHandleGameLine && window.pwHandleGameLine(line)) {
          return;
        }
        // Fatal game output (Nim's quit message) lands on the loading
        // screen instead of dying silently in the console, and join
        // progress keeps the wait honest while the lobby holds.
        // Hash mismatch is not fatal: playback continues (the tape
        // player already counts mismatches and keeps going). Treating
        // it as a boot error froze Observatory Featured Match under
        // the title overlay.
        var text = '' + line;
        if (/hash mismatch/i.test(text)) {
          return;
        }
        if (/^(join failed|error|fatal)/i.test(text)) {
          bootError(text + ' — reload the page to retry');
          return;
        }
        if (/^join:/i.test(line)) {
          var note = document.getElementById('bootNote');
          if (note && note.className.indexOf('error') === -1) {
            note.dataset.live = '1';
            note.textContent = line.replace(/^join:\s*/i, '');
          }
        }
      }
      function replayParam() {
        return new URLSearchParams(location.search).get('replay') ||
          new URLSearchParams(location.hash.replace(/^#/, '')).get('replay');
      }
      var replayUrl = replayParam();
      var Module = {
        arguments: replayUrl ? ['--replay', '/replay.pwr'] :
          new URLSearchParams(location.search).has('join') ? [] :
          ['--human:0', '--bot', '/base.bas:6', '--name', 'Wrangler'],
        preRun: [(function() {
          if (!replayUrl) {
            return;
          }
          Module.addRunDependency('replay');
          function mountReplay(buf) {
            var bytes = new Uint8Array(buf);
            FS.writeFile('/replay.pwr', bytes, {encoding: 'binary'});
            Module.removeRunDependency('replay');
          }
          function maybeGunzip(buf) {
            var bytes = new Uint8Array(buf);
            if (bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b) {
              return new Response(
                new Blob([bytes]).stream().pipeThrough(
                  new DecompressionStream('gzip')
                )
              ).arrayBuffer();
            }
            return Promise.resolve(buf);
          }
          fetch(replayUrl, {credentials: 'omit'})
            .then(function(response) {
              if (!response.ok) {
                throw new Error('HTTP ' + response.status);
              }
              return response.arrayBuffer();
            })
            .then(maybeGunzip)
            .then(mountReplay)
            .catch(function(err) {
              bootError('replay failed to load — ' + err);
            });
        })],
        postRun: [],
        print: function(text) {
          console.log(text);
          watchLine('' + text);
        },
        printErr: function(text) {
          console.error(text);
          watchLine('' + text);
        },
        onExit: function(status) {
          if (status !== 0) {
            var note = document.getElementById('bootNote');
            if (!note || note.className.indexOf('error') === -1) {
              bootError(
                'the game stopped (code ' + status +
                ') — reload the page to retry'
              );
            }
          }
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener(
            "webglcontextlost",
            function(e) {
              console.error('WebGL context lost. You will need to reload the page.');
              e.preventDefault();
            }, false);

          return canvas;
        })(),
        setStatus: function(text) {
          // The file packager reports "Downloading data... (loaded/total)".
          var note = document.getElementById('bootNote');
          if (!note) return;
          var progress = text.match(/\((\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)\)/);
          if (progress) {
            var percent = Math.round(
              parseFloat(progress[1]) * 100 / parseFloat(progress[2])
            );
            var bar = document.getElementById('bootBar');
            if (bar) bar.style.width = percent + '%';
            if (window.pwBoot) window.pwBoot.setProgress(percent / 100);
            note.textContent = 'Coiling lassos — ' + percent + '%';
          } else if (text) {
            note.textContent = text;
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          if (this.totalDependencies > 0 && left === 0) {
            Module.setStatus('Preparing the arena…');
          }
        },
        onRuntimeInitialized: function() {
          Module.setStatus('Preparing the arena…');
          if (window.pwBoot) window.pwBoot.setProgress(1);
          // The game sizes its canvas once the window comes up; that is
          // the moment the first frame can draw. Never fade to a blank
          // page: without a sized canvas keep the overlay and its note.
          var canvas = document.getElementById('canvas');
          var began = performance.now();
          function watch() {
            var note = document.getElementById('bootNote');
            if (note && note.className.indexOf('error') >= 0) {
              return;
            }
            if (canvas.width > 400 || canvas.height > 400) {
              bootGone();
              return;
            }
            if (note && performance.now() - began > 25000 &&
                note.dataset.live !== '1') {
              note.textContent =
                'Still working — is the host running? Keep this tab in the foreground.';
            }
            requestAnimationFrame(watch);
          }
          requestAnimationFrame(watch);
        }
      };
      window.onerror = function(message) {
        console.info('Exception thrown, see JavaScript console');
        bootError('something broke while loading — reload the page to retry');
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pudge Wars — Lobby</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23d4b45a'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23070b14'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #070b14;
    --navy: #0c1422;
    --panel: #121b2c;
    --panel-hi: #1a2740;
    --edge: #3d4f6a;
    --gold: #d4b45a;
    --gold-hi: #f0da80;
    --ink: #e6edf7;
    --dim: #8b97ad;
    --west: #d4544c;
    --east: #4a94dc;
    --green: #6edc7a;
    --sys: #c4a35a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(900px 420px at 50% -8%, #18243c 0%, var(--bg) 58%),
      repeating-linear-gradient(
        0deg, transparent, transparent 3px, rgba(255,255,255,0.015) 3px,
        rgba(255,255,255,0.015) 4px
      );
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .frame {
    background: var(--panel);
    border: 1px solid var(--gold);
    box-shadow:
      inset 0 1px 0 rgba(255, 230, 160, 0.22),
      inset 0 -1px 0 rgba(0, 0, 0, 0.45),
      0 0 0 1px #1a1408,
      0 10px 28px rgba(0, 0, 0, 0.45);
  }
  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 22px 12px;
    border-bottom: 1px solid #2a3a55;
    flex-wrap: wrap;
  }
  .brand h1 {
    font-size: 28px;
    letter-spacing: 8px;
    font-weight: 800;
    color: var(--gold-hi);
    text-shadow: 0 2px 16px rgba(212, 180, 90, 0.28);
  }
  .brand .channel {
    color: var(--dim);
    letter-spacing: 2px;
    font-size: 12px;
    margin-top: 4px;
    min-height: 16px;
  }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip, button, .btn {
    background: var(--navy);
    border: 1px solid var(--edge);
    color: var(--dim);
    border-radius: 2px;
    padding: 8px 12px;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    font-family: inherit;
  }
  .chip:hover, button:hover { background: var(--panel-hi); color: var(--ink); }
  .chip.ready { color: var(--green); border-color: #2c4a33; cursor: default; }
  .chip.warn { color: var(--west); border-color: #4a2c2c; cursor: default; }
  .chip .bar {
    display: inline-block; width: 70px; height: 6px; margin-left: 8px;
    background: var(--navy); overflow: hidden; vertical-align: middle;
  }
  .chip .bar i {
    display: block; height: 100%; width: 0%;
    background: var(--gold); transition: width 0.25s ease;
  }
  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(280px, 1.2fr) minmax(280px, 1fr);
    gap: 14px;
    padding: 14px;
    min-height: 0;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }
  .col {
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .col h2 {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gold);
    padding: 10px 12px 8px;
    border-bottom: 1px solid #2a3a55;
  }
  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.45;
  }
  .chat-line { margin-bottom: 4px; word-wrap: break-word; }
  .chat-line .who { color: var(--gold-hi); font-weight: 700; }
  .chat-line.sys { color: var(--sys); font-style: italic; }
  .chat-line .msg { color: var(--ink); }
  .people {
    max-height: 140px;
    overflow-y: auto;
    padding: 8px 12px 12px;
    border-top: 1px solid #2a3a55;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .person {
    border: 1px solid var(--edge);
    padding: 3px 8px;
    font-size: 12px;
    color: var(--ink);
    background: var(--navy);
  }
  .person.host { border-color: var(--gold); color: var(--gold-hi); }
  .person.you { background: rgba(212, 180, 90, 0.12); }
  .person.lobby { color: var(--dim); }
  .game-info {
    padding: 10px 12px;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 1px;
    border-bottom: 1px solid #2a3a55;
  }
  .teams { padding: 10px; display: flex; gap: 12px; flex-wrap: wrap; }
  .team { flex: 1; min-width: 200px; }
  .team h3 {
    font-size: 12px; letter-spacing: 3px; margin-bottom: 8px; text-align: center;
  }
  .team.west h3 { color: var(--west); }
  .team.east h3 { color: var(--east); }
  .seat {
    background: var(--navy);
    border: 1px solid var(--edge);
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .seat:hover { background: var(--panel-hi); border-color: #5a7090; }
  .team.west .seat { border-left: 3px solid var(--west); }
  .team.east .seat { border-left: 3px solid var(--east); }
  .seat .who { font-size: 15px; font-weight: 700; }
  .seat .tag { font-size: 11px; color: var(--dim); letter-spacing: 1px; }
  .seat.bot .who { color: var(--dim); font-weight: 400; }
  .seat.taken { cursor: default; }
  .seat.away .who { color: var(--dim); font-style: italic; }
  .seat.mine {
    border-color: var(--gold);
    background: rgba(212, 180, 90, 0.08);
  }
  .seat.off { cursor: default; opacity: 0.45; }
  .seat.off .who { font-weight: 400; }
  .bottom {
    display: flex;
    gap: 10px;
    padding: 12px 14px 16px;
    align-items: center;
    flex-wrap: wrap;
    border-top: 1px solid #2a3a55;
  }
  .bottom input[type=text], .gate input[type=text] {
    background: var(--navy);
    border: 1px solid var(--edge);
    color: var(--ink);
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    flex: 1;
    min-width: 160px;
  }
  .bottom input[type=text]:focus, .gate input[type=text]:focus {
    border-color: var(--gold);
  }
  .gold {
    background: var(--gold) !important;
    color: #201a06 !important;
    border-color: var(--gold-hi) !important;
    font-weight: 800;
    letter-spacing: 1.5px;
  }
  .gold:hover { filter: brightness(1.08); }
  .status { color: var(--dim); font-size: 13px; letter-spacing: 1px; }
  .status .big { color: var(--ink); font-weight: 700; }
  .error { color: var(--west); }
  .ok { color: var(--green); }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  .gate {
    position: fixed; inset: 0;
    background: rgba(7, 11, 20, 0.86);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .gate.hidden { display: none; }
  .gate-card {
    width: min(440px, 100%);
    padding: 28px 26px 24px;
  }
  .gate-card h1 {
    font-size: 26px; letter-spacing: 7px; color: var(--gold-hi);
    text-align: center; margin-bottom: 6px;
  }
  .gate-card .sub {
    text-align: center; color: var(--dim); letter-spacing: 1px;
    font-size: 13px; margin-bottom: 22px;
  }
  .gate-card label {
    display: block; color: var(--gold); font-size: 11px;
    letter-spacing: 2px; margin: 12px 0 6px;
  }
  .gate-card .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
  .gate-card .gold { width: 100%; margin-top: 18px; padding: 12px; }
  a.btn { text-decoration: none; display: inline-block; }
</style>
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card frame">
      <h1>PUDGE WARS</h1>
      <div class="sub">ENTER THE CHANNEL TO PLAY OR WATCH</div>
      <label for="gateName">YOUR NAME</label>
      <input id="gateName" type="text" maxlength="24" placeholder="Player" autocomplete="nickname">
      <label for="gateHost">GAME HOST</label>
      <input id="gateHost" type="text" placeholder="this server">
      <div class="hint">Anyone with the host address can join this lobby from a browser. Leave blank to use this page&rsquo;s server.</div>
      <button id="enterBtn" class="gold" type="button">ENTER CHANNEL</button>
      <div id="gateErr" class="error" style="margin-top:10px;min-height:18px"></div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">
      <h1>PUDGE WARS</h1>
      <div id="sub" class="channel">CHANNEL — BUTCHER&rsquo;S RIVER</div>
    </div>
    <div class="toolbar">
      <span id="invite" class="chip" title="Copy the lobby link">COPY INVITE LINK</span>
      <span id="changeHost" class="chip" title="Join a different game host">CHANGE HOST</span>
      <span id="preload" class="chip" style="display:none"></span>
    </div>
  </header>

  <div class="layout">
    <section class="col frame">
      <h2>CHAT</h2>
      <div id="chatLog" class="chat-log"></div>
      <div>
        <h2>IN CHANNEL</h2>
        <div id="people" class="people"></div>
      </div>
    </section>
    <section class="col frame">
      <h2>THE GAME</h2>
      <div id="gameInfo" class="game-info">Waiting for host&hellip;</div>
      <div class="teams" style="flex:1;overflow-y:auto">
        <div class="team west">
          <h3>WEST BANK</h3>
          <div id="westSeats"></div>
        </div>
        <div class="team east">
          <h3>EAST BANK</h3>
          <div id="eastSeats"></div>
        </div>
      </div>
      <div id="status" class="status" style="padding:10px 12px 12px"></div>
    </section>
  </div>

  <div class="bottom">
    <input id="chatInput" type="text" maxlength="200" placeholder="Send a message to the channel" autocomplete="off">
    <button id="sendBtn" type="button">SEND</button>
    <button id="joinBtn" class="gold" type="button">JOIN GAME</button>
    <button id="watchBtn" type="button">WATCH</button>
  </div>

<script>
'use strict'

var GAME = {
  id: 'pw',
  playPage: 'pw.html',
  bundle: ['pw.data', 'pw.wasm', 'pw.js', 'pw.html'],
  tokenKey: 'pwToken',
  nameKey: 'pwName',
  hostKey: 'pwHost',
  seatCount: 6,
  channel: "BUTCHER'S RIVER"
}

var ws = null
var wsUp = false
var inChannel = false
var mySlot = -1
var myToken = sessionStorage.getItem(GAME.tokenKey) || ''
var started = false
var lastSeats = []
var lastPeople = []
var hasWebBuild = null
var currentHost = ''
var statusEl = document.getElementById('status')
var nameEl = document.getElementById('gateName')
var hostEl = document.getElementById('gateHost')
var subEl = document.getElementById('sub')
var inviteEl = document.getElementById('invite')
var preloadEl = document.getElementById('preload')
var chatLogEl = document.getElementById('chatLog')
var chatInput = document.getElementById('chatInput')
var peopleEl = document.getElementById('people')
var gameInfoEl = document.getElementById('gameInfo')
var gateEl = document.getElementById('gate')
var gateErr = document.getElementById('gateErr')

nameEl.value = localStorage.getItem(GAME.nameKey) || ''
hostEl.value = queryHost() || pageHost() || localStorage.getItem(GAME.hostKey) || ''

function queryHost () {
  try {
    return new URLSearchParams(location.search).get('host') || ''
  } catch (err) {
    return ''
  }
}

function parseHost (raw) {
  var s = (raw || '').trim()
  if (!s) return ''
  s = s.replace(/\/+$/, '')
  s = s.replace(/^(wss|ws|https|http):\/\//, '')
  s = s.replace(/\/ws$/, '')
  return s
}

function pageHost () {
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    return location.host
  }
  return ''
}

function httpOrigin (host) {
  if (!host) return ''
  if (location.protocol === 'https:' && host === location.host) {
    return location.origin
  }
  if (location.protocol === 'http:' && host === location.host) {
    return location.origin
  }
  return 'http://' + host
}

function myName () {
  var name = nameEl.value.trim()
  return name.length > 0 ? name : 'Player'
}

function send (obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj))
}

function rememberSeat (slot, token) {
  mySlot = slot
  myToken = token || ''
  if (myToken) sessionStorage.setItem(GAME.tokenKey, myToken)
  else sessionStorage.removeItem(GAME.tokenKey)
}

function playUrl () {
  var params = new URLSearchParams()
  params.set('join', '1')
  params.set('name', myName())
  if (myToken) params.set('token', myToken)
  return httpOrigin(currentHost) + '/play/' + GAME.playPage + '?' + params.toString()
}

function enterGame () {
  window.location.href = playUrl()
}

function escapeHtml (text) {
  var div = document.createElement('div')
  div.textContent = text
  return div.innerHTML
}

function appendChat (msg) {
  var line = document.createElement('div')
  if (msg.sys) {
    line.className = 'chat-line sys'
    line.textContent = msg.text || ''
  } else {
    line.className = 'chat-line'
    line.innerHTML =
      '<span class="who">' + escapeHtml(msg.name || 'Player') + ':</span> ' +
      '<span class="msg">' + escapeHtml(msg.text || '') + '</span>'
  }
  var stick =
    chatLogEl.scrollHeight - chatLogEl.scrollTop - chatLogEl.clientHeight < 40
  chatLogEl.appendChild(line)
  if (stick) chatLogEl.scrollTop = chatLogEl.scrollHeight
}

inviteEl.addEventListener('click', function () {
  var link = httpOrigin(currentHost) + '/'
  function flash (label) {
    inviteEl.textContent = label
    setTimeout(function () { inviteEl.textContent = 'COPY INVITE LINK' }, 1400)
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(
      function () { flash('LINK COPIED') },
      function () { flash(link) }
    )
  } else {
    window.prompt('Send this link to your friends:', link)
  }
})

var preloadState = 'idle'

function setPreload (className, html) {
  preloadEl.style.display = ''
  preloadEl.className = 'chip ' + className
  preloadEl.innerHTML = html
}

function preloadGame () {
  if (preloadState !== 'idle' || !window.fetch) return
  preloadState = 'running'
  var files = GAME.bundle
  var totals = []
  var loaded = []
  var base = httpOrigin(currentHost) + '/play/'

  function render () {
    var total = 0
    var done = 0
    for (var i = 0; i < files.length; i++) {
      total += totals[i] || 0
      done += loaded[i] || 0
    }
    var percent = total > 0 ? Math.round(done * 100 / total) : 0
    setPreload(
      '',
      'LOADING ARENA ' + percent + '%' +
      '<span class="bar"><i style="width:' + percent + '%"></i></span>'
    )
  }

  function fetchOne (index) {
    if (index >= files.length) {
      preloadState = 'done'
      setPreload('ready', 'ARENA READY — ENTRY IS INSTANT')
      return
    }
    fetch(base + files[index]).then(function (response) {
      if (!response.ok) throw new Error('http ' + response.status)
      totals[index] = Number(response.headers.get('Content-Length')) || 0
      if (!response.body || !response.body.getReader) {
        return response.arrayBuffer().then(function (buffer) {
          loaded[index] = buffer.byteLength
          totals[index] = buffer.byteLength
          render()
        })
      }
      var reader = response.body.getReader()
      loaded[index] = 0
      function pump () {
        return reader.read().then(function (chunk) {
          if (chunk.done) return
          loaded[index] += chunk.value.length
          render()
          return pump()
        })
      }
      return pump()
    }).then(function () {
      fetchOne(index + 1)
    }).catch(function () {
      preloadState = 'failed'
      setPreload('warn', 'WEB CLIENT UNAVAILABLE ON THIS HOST')
    })
  }

  render()
  fetchOne(0)
}

function renderSub (msg) {
  var parts = ['CHANNEL — ' + GAME.channel]
  if (msg && msg.host) parts.push('HOST ' + String(msg.host).toUpperCase())
  var n = 0
  for (var i = 0; i < lastPeople.length; i++) n++
  if (n > 0) parts.push(n + ' IN LOBBY')
  subEl.textContent = parts.join('  ·  ')
  if (!msg) return
  var info = []
  if (msg.teamSize > 0) info.push(msg.teamSize + 'v' + msg.teamSize)
  if (msg.goal > 0) info.push('FIRST TO ' + msg.goal + ' KILLS')
  if (msg.runes > 0) info.push('RUNES EVERY ' + msg.runes + 'S')
  if (started) info.push('MATCH IN PROGRESS')
  else info.push('OPEN GAME — ANYONE MAY JOIN')
  gameInfoEl.textContent = info.join('  ·  ')
}

function claimedCount () {
  var count = 0
  for (var i = 0; i < lastSeats.length; i++) {
    if (lastSeats[i] && lastSeats[i].human) count++
  }
  return count
}

function renderStatus (extra) {
  if (!inChannel) {
    statusEl.innerHTML = '<div class="pulse">enter the channel to join this lobby</div>'
  } else if (!wsUp) {
    statusEl.innerHTML =
      '<div class="error pulse">connecting to the host&hellip;</div>'
  } else if (started) {
    statusEl.innerHTML =
      '<div class="big ok">MATCH IN PROGRESS</div>' +
      '<a class="btn gold" href="' + playUrl() + '">' +
      (mySlot >= 0 ? 'ENTER THE ARENA' : 'WATCH LIVE') + '</a>' +
      (mySlot < 0
        ? '<div style="margin-top:8px">or JOIN GAME to take a bot seat</div>'
        : '')
  } else if (extra) {
    statusEl.innerHTML = extra
  } else if (mySlot >= 0) {
    statusEl.innerHTML =
      '<div class="big">SEAT CLAIMED</div>' +
      '<div class="pulse">waiting for the host to start the match&hellip;</div>'
  } else {
    statusEl.innerHTML =
      '<div class="pulse">JOIN GAME or click a seat — ' +
      claimedCount() + '/' + GAME.seatCount + ' butchers claimed</div>'
  }
}

function ensureSeats (count) {
  GAME.seatCount = count
  var west = document.getElementById('westSeats')
  var east = document.getElementById('eastSeats')
  var n = Math.max(Math.floor(count / 2), 1)
  function fill (root, start, end) {
    root.innerHTML = ''
    for (var i = start; i < end; i++) {
      var el = document.createElement('div')
      el.id = 'seat' + i
      el.className = 'seat'
      el.dataset.slot = String(i)
      root.appendChild(el)
    }
  }
  fill(west, 0, n)
  fill(east, n, count)
}

function renderSeats () {
  var count = lastSeats.length || GAME.seatCount
  if (document.getElementById('westSeats').children.length !== Math.max(Math.floor(count / 2), 1) ||
      GAME.seatCount !== count) {
    ensureSeats(count)
  }
  for (var i = 0; i < GAME.seatCount; i++) {
    var el = document.getElementById('seat' + i)
    if (!el) continue
    var seat = lastSeats[i] || { name: '', human: false, connected: false, off: false }
    var mine = i === mySlot
    el.className = 'seat' +
      (seat.off ? ' off' : '') +
      (seat.human ? ' taken' : ' bot') +
      (seat.human && !seat.connected ? ' away' : '') +
      (mine ? ' mine' : '')
    var who, tag
    if (seat.off) {
      who = 'Seat off'
      tag = 'NO BUTCHER'
    } else if (mine) {
      who = myName()
      tag = 'YOU — CLICK TO LEAVE'
    } else if (seat.human && seat.connected) {
      who = seat.name || 'Player'
      tag = 'HUMAN'
    } else if (seat.human) {
      who = seat.name || 'Player'
      tag = started ? 'AWAY — SEAT RESERVED' : 'AWAY — CLICK TO CLAIM'
    } else {
      who = (seat.bot || 'Butcher') + ' Bot'
      tag = started ? 'CLICK TO TAKE OVER' : 'OPEN — CLICK TO CLAIM'
    }
    el.innerHTML =
      '<span class="who">' + escapeHtml(who) + '</span>' +
      '<span class="tag">' + tag + '</span>'
  }
}

function renderPeople () {
  peopleEl.innerHTML = ''
  for (var i = 0; i < lastPeople.length; i++) {
    var p = lastPeople[i] || {}
    var el = document.createElement('span')
    var mine = p.role !== 'host' && p.name === myName() &&
      (p.slot === mySlot || (mySlot < 0 && p.slot < 0))
    el.className = 'person' +
      (p.role === 'host' ? ' host' : '') +
      (p.role === 'lobby' ? ' lobby' : '') +
      (mine ? ' you' : '')
    var label = p.name || 'Player'
    if (p.role === 'host') label += ' (host)'
    else if (p.slot >= 0) label += ' · seat ' + (p.slot + 1)
    else label += ' · lobby'
    el.textContent = label
    peopleEl.appendChild(el)
  }
}

document.querySelector('.teams').addEventListener('click', function (event) {
  var el = event.target.closest ? event.target.closest('.seat') : null
  if (!el || !inChannel || el.classList.contains('off')) return
  var slot = parseInt(el.dataset.slot, 10)
  if (isNaN(slot)) return
  if (slot === mySlot) send({ t: 'leave' })
  else {
    send({ t: 'name', name: myName() })
    send({ t: 'pick', slot: slot })
  }
})

document.getElementById('joinBtn').addEventListener('click', function () {
  if (!inChannel) return
  send({ t: 'name', name: myName() })
  send({ t: 'join' })
})

document.getElementById('watchBtn').addEventListener('click', function () {
  if (!inChannel) return
  if (started && mySlot < 0) {
    enterGame()
    return
  }
  send({ t: 'leave' })
})

function sendChat () {
  var text = chatInput.value.trim()
  if (!text || !inChannel) return
  send({ t: 'chat', text: text })
  chatInput.value = ''
}

document.getElementById('sendBtn').addEventListener('click', sendChat)
chatInput.addEventListener('keydown', function (event) {
  if (event.key === 'Enter') sendChat()
})

function connect () {
  if (!currentHost) {
    gateErr.textContent = 'Enter a game host address.'
    return
  }
  var scheme =
    (location.protocol === 'https:' && currentHost === location.host)
      ? 'wss://' : 'ws://'
  try {
    ws = new WebSocket(scheme + currentHost + '/ws')
  } catch (err) {
    gateErr.textContent = 'Cannot open that host.'
    return
  }
  ws.onopen = function () {
    wsUp = true
    gateErr.textContent = ''
    send({ t: 'hello', name: myName(), token: myToken })
    renderStatus()
  }
  ws.onmessage = function (event) {
    var msg
    try { msg = JSON.parse(event.data) } catch (err) { return }
    if (msg.t === 'lobby') {
      lastSeats = msg.seats || []
      lastPeople = msg.people || []
      started = !!msg.started
      renderSub(msg)
      if (hasWebBuild === null && typeof msg.web === 'boolean') {
        hasWebBuild = msg.web
        if (hasWebBuild) preloadGame()
        else setPreload('warn', 'WEB CLIENT UNAVAILABLE ON THIS HOST')
      }
      renderSeats()
      renderPeople()
      renderStatus()
    } else if (msg.t === 'chat') {
      appendChat(msg)
    } else if (msg.t === 'grant') {
      rememberSeat(msg.slot, msg.token)
      renderSeats()
      if (started && mySlot >= 0) enterGame()
      else renderStatus()
    } else if (msg.t === 'deny') {
      renderStatus(
        '<div class="error">' + escapeHtml(msg.reason || 'denied') + '</div>'
      )
      setTimeout(renderStatus, 1800)
    } else if (msg.t === 'start') {
      started = true
      if (mySlot >= 0) enterGame()
      else renderStatus()
    }
  }
  ws.onclose = function () {
    wsUp = false
    mySlot = -1
    renderStatus()
    if (inChannel) setTimeout(connect, 2000)
  }
  ws.onerror = function () {
    gateErr.textContent = 'Could not reach ' + currentHost
  }
}

function enterChannel () {
  var name = myName()
  localStorage.setItem(GAME.nameKey, name)
  currentHost = parseHost(hostEl.value) || pageHost()
  if (!currentHost) {
    gateErr.textContent = 'This page is not on a host — type an address like 192.168.1.10:8000'
    return
  }
  localStorage.setItem(GAME.hostKey, currentHost)
  inChannel = true
  gateEl.classList.add('hidden')
  connect()
}

document.getElementById('changeHost').addEventListener('click', function () {
  inChannel = false
  if (ws) {
    try { ws.close() } catch (err) {}
  }
  wsUp = false
  mySlot = -1
  hostEl.value = currentHost || pageHost()
  gateErr.textContent = ''
  gateEl.classList.remove('hidden')
  nameEl.focus()
})

document.getElementById('enterBtn').addEventListener('click', enterChannel)
nameEl.addEventListener('keydown', function (event) {
  if (event.key === 'Enter') enterChannel()
})
hostEl.addEventListener('keydown', function (event) {
  if (event.key === 'Enter') enterChannel()
})

renderSeats()
renderStatus()

if (nameEl.value.trim() && (parseHost(hostEl.value) || pageHost())) {
  enterChannel()
}
</script>
</body>
</html>

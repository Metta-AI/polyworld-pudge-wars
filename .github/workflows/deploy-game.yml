# Build and deploy the source-owned Pudge Wars Coworld package.
#
# Lifecycle:
#   1. `coworld next-version pudge-wars` allocates the next registry version.
#   2. `coworld build` builds the linux/amd64 game image from coworld/compose.yaml,
#      compiles the Emscripten replay viewer, pins source URLs to this checkout,
#      stamps the version, and writes the hydrated manifest.
#   3. Upload that exact hydrated manifest. Upload queues hosted certification
#      and does not patch an existing hosted Coworld.
#
# Required environment secrets (Settings -> Environments -> SOFTMAX_OBSERVATORY):
#   SOFTMAX_API_TOKEN         - a TEAM `usr_` token. The `coworld`/`softmax` CLI
#                               reads its bearer token from ~/.softmax/credentials.yaml,
#                               NOT from this env var, so the workflow seeds it
#                               headlessly via `softmax set-token`. Reuse the same
#                               token as Metta-AI/coworld-crewrift.
#
# The Coworld CLI is installed from the public package repo so deploys use the
# current registry/version allocator without waiting for a PyPI release.
name: "Deploy Pudge Wars Game"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit pudge-wars version to publish. Leave blank to auto-resolve."
        required: false
        default: ""
      skip_upload:
        description: "Skip coworld upload-coworld (build only)."
        type: boolean
        default: false

concurrency:
  group: deploy-game
  cancel-in-progress: false

env:
  COWORLD_CLI: "coworld[auth] @ git+https://github.com/Metta-AI/coworld.git@main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SOFTMAX_OBSERVATORY
    # Hosted smoke and full certification each have a 30-minute budget after
    # the image/viewer build, so the job timeout must cover both waits.
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install coworld CLI
        run: uvx --from "$COWORLD_CLI" coworld --help >/dev/null

      # The pinned bundle is the certified 0.3.21 viewer for simulator 37.
      - name: Check replay viewer simulator version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          assert "ReplayGameVersion* = 37'u16" in Path("examples/pudge_wars/replays.nim").read_text()
          PY

      - uses: docker/setup-buildx-action@v3

      - name: Preflight Docker (required for build)
        run: |
          docker version
          docker info
          if ! docker compose version >/dev/null 2>&1; then
            echo "docker compose plugin missing; installing docker-compose-plugin..."
            sudo apt-get update
            sudo apt-get install -y docker-compose-plugin
          fi
          docker compose version
          docker ps >/dev/null

      - name: Seed Softmax credentials
        env:
          SOFTMAX_API_TOKEN: ${{ secrets.SOFTMAX_API_TOKEN }}
        run: |
          if [ -z "$SOFTMAX_API_TOKEN" ]; then
            echo "::error::SOFTMAX_API_TOKEN secret is empty. Set a team usr_ token on the SOFTMAX_OBSERVATORY environment."
            exit 1
          fi
          uvx --from "$COWORLD_CLI" softmax set-token "$SOFTMAX_API_TOKEN" --server https://softmax.com/api
          uv run --with "$COWORLD_CLI" python3 -c "from softmax.auth import clear_active_player_session; clear_active_player_session(server='https://softmax.com/api')"

      - name: Resolve next version
        id: ver
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version || '' }}"
          if [ -n "$INPUT_VERSION" ]; then
            NEXT="$INPUT_VERSION"
          else
            NEXT=$(uvx --from "$COWORLD_CLI" coworld --elevated next-version pudge-wars)
          fi
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Deploying pudge-wars:${NEXT}"

      - name: Build hydrated Coworld manifest
        run: |
          uvx --from "$COWORLD_CLI" coworld build \
            --project coworld \
            --version "${{ steps.ver.outputs.version }}" \
            --output dist/coworld_manifest.json

      - name: Upload and certify hydrated Coworld manifest
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_upload != 'true' }}
        run: |
          uvx --from "$COWORLD_CLI" coworld --elevated upload-coworld \
            coworld/dist/coworld_manifest.json \
            --wait-hosted-smoke \
            --hosted-smoke-timeout-seconds 1800 \
            --wait-certification \
            --certification-timeout-seconds 1800

      - name: Verify canonical upload
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_upload != 'true' }}
        run: |
          set -euo pipefail
          uvx --from "$COWORLD_CLI" coworld --elevated list --json --limit 500 > /tmp/coworlds-after.json
          python3 - "${{ steps.ver.outputs.version }}" <<'EOF'
          import json
          import sys

          expected = sys.argv[1]
          payload = json.load(open("/tmp/coworlds-after.json"))
          rows = payload["entries"] if isinstance(payload, dict) else payload
          match = next(
              (row for row in rows if row.get("name") == "pudge-wars" and row.get("version") == expected),
              None,
          )
          if match is None:
              raise SystemExit(f"::error::Uploaded pudge-wars:{expected} not found")
          if not match.get("canonical"):
              raise SystemExit(f"::error::pudge-wars:{expected} is not canonical after hosted smoke")
          print(f"pudge-wars:{expected} is canonical ({match['id']})")
          EOF
